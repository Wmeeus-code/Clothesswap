<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TryOn AI - Virtuele Pasbeurt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7f6f2; }
  </style>
</head>
<body class="bg-[#f7f6f2] text-stone-800">

  <header class="bg-white border-b border-stone-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-lg">✨</div>
        <span class="text-xl font-bold tracking-tight">TryOn <span class="text-emerald-600">AI</span></span>
      </div>
      <div class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        API Actief
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    
    <div id="token-banner" class="bg-stone-900 text-white p-4 rounded-2xl mb-6 shadow-sm">
      <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-emerald-400">Replicate API Token</label>
      <div class="flex gap-2">
        <input type="password" id="api-token-input" placeholder="Plak je token (r8_...)" class="w-full bg-white/10 border border-stone-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-400">
        <button onclick="saveToken()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-sm transition">Opslaan</button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <div class="lg:col-span-4 bg-white p-5 rounded-2xl border border-stone-200 shadow-sm space-y-6">
        
        <div>
          <label class="block text-sm font-bold text-stone-900 mb-2">Stap 1: Foto van jezelf</label>
          <div class="border-2 border-dashed border-stone-300 rounded-xl p-4 text-center hover:border-emerald-500 transition bg-stone-50 cursor-pointer" onclick="document.getElementById('user-upload').click()">
            <i class="fa-solid fa-camera text-stone-400 text-2xl mb-1"></i>
            <p class="text-xs font-semibold text-stone-700" id="user-upload-text">Upload een foto van jezelf</p>
            <input type="file" id="user-upload" class="hidden" accept="image/*" onchange="processImage(event, 'user')">
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-stone-900 mb-2">Stap 2: Upload kledingstuk</label>
          <div class="border-2 border-dashed border-stone-300 rounded-xl p-4 text-center hover:border-emerald-500 transition bg-stone-50 cursor-pointer" onclick="document.getElementById('cloth-upload').click()">
            <i class="fa-solid fa-shirt text-stone-400 text-2xl mb-1"></i>
            <p class="text-xs font-semibold text-stone-700" id="cloth-upload-text">Upload een kledingstuk</p>
            <input type="file" id="cloth-upload" class="hidden" accept="image/*" onchange="processImage(event, 'cloth')">
          </div>
        </div>

        <button onclick="generateRealTryOn()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-md transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Genereer Echte AI Pasbeurt
        </button>

      </div>

      <div class="lg:col-span-8 bg-white p-5 rounded-2xl border border-stone-200 shadow-sm flex flex-col justify-between">
        <div>
          <h2 class="text-lg font-bold text-stone-900 mb-4">AI Pasresultaat</h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="relative rounded-xl overflow-hidden bg-stone-100 border border-stone-200 aspect-[3/4]">
              <img id="person-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600" class="w-full h-full object-cover" alt="Persoon">
              <span class="absolute bottom-3 left-3 bg-black/60 backdrop-blur text-white text-xs font-semibold px-2.5 py-1 rounded-md">Jouw Foto</span>
            </div>

            <div class="relative rounded-xl overflow-hidden bg-stone-100 border border-stone-200 aspect-[3/4] flex items-center justify-center">
              <div id="loading-spinner" class="hidden flex-col items-center gap-2 text-emerald-600">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl"></i>
                <span class="text-xs font-bold" id="loading-text">AI verwerkt pasbeurt (10-15 sec)...</span>
              </div>
              <img id="result-img" src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600" class="w-full h-full object-cover" alt="AI Resultaat">
              <span class="absolute bottom-3 left-3 bg-emerald-600 text-white text-xs font-semibold px-2.5 py-1 rounded-md">✨ Echte AI Gegenereerd</span>
            </div>
          </div>
        </div>

        <div class="mt-4 pt-4 border-t border-stone-100 flex justify-between items-center text-xs text-stone-500">
          <span>Status: <strong id="status-text" class="text-emerald-600">Voer je Token in</strong></span>
          <span>Model: IDM-VTON</span>
        </div>
      </div>

    </div>
  </main>

  <script>
    let userBase64 = null;
    let clothBase64 = null;

    window.onload = function() {
      const savedToken = localStorage.getItem('replicate_token');
      if (savedToken) {
        document.getElementById('api-token-input').value = savedToken;
        document.getElementById('status-text').innerText = "Token geladen! Upload foto's";
      }
    };

    function saveToken() {
      const token = document.getElementById('api-token-input').value.trim();
      if (token) {
        localStorage.setItem('replicate_token', token);
        document.getElementById('status-text').innerText = "Token opgeslagen!";
        alert("Token opgeslagen in je browser!");
      }
    }

    function processImage(event, type) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 600;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const resizedBase64 = canvas.toDataURL('image/jpeg', 0.8);

          if (type === 'user') {
            userBase64 = resizedBase64;
            document.getElementById('person-img').src = userBase64;
            document.getElementById('user-upload-text').innerText = "Foto geladen!";
          } else {
            clothBase64 = resizedBase64;
            document.getElementById('cloth-upload-text').innerText = "Kleding geladen!";
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function generateRealTryOn() {
      const token = localStorage.getItem('replicate_token') || document.getElementById('api-token-input').value.trim();
      
      if (!token) {
        alert("Voer eerst je Replicate API Token in bovenaan de pagina!");
        return;
      }

      if (!userBase64 || !clothBase64) {
        alert("Upload a.u.b. zowel een foto van jezelf ALS een kledingstuk!");
        return;
      }

      const spinner = document.getElementById('loading-spinner');
      const resultImg = document.getElementById('result-img');
      const statusText = document.getElementById('status-text');

      resultImg.classList.add('hidden');
      spinner.classList.remove('hidden');
      spinner.classList.add('flex');
      statusText.innerText = "Verzoek verwerken...";

      // Gebruik ThingProxy om CORS-blokkades van Replicate te omzeilen
      const proxy = "https://thingproxy.freeboard.io/fetch/";
      const targetUrl = "https://api.replicate.com/v1/predictions";

      try {
        const response = await fetch(proxy + targetUrl, {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            version: "c87eec610ab5800070c58977739717d121542dded30f2bb00337c1a84f392289",
            input: {
              human_img: userBase64,
              garm_img: clothBase64,
              garment_des: "clothing item"
            }
          })
        });

        const data = await response.json();
        
        if(data.error || data.detail) {
          alert("Replicate Melding: " + (data.error || data.detail));
          spinner.classList.add('hidden');
          resultImg.classList.remove('hidden');
          return;
        }

        pollPrediction(data.urls.get, token);

      } catch (err) {
        alert("Fout bij verbinding: " + err.message);
        spinner.classList.add('hidden');
        resultImg.classList.remove('hidden');
      }
    }

    async function pollPrediction(getUrl, token) {
      const statusText = document.getElementById('status-text');
      const proxy = "https://thingproxy.freeboard.io/fetch/";
      
      const interval = setInterval(async () => {
        try {
          const res = await fetch(proxy + getUrl, {
            headers: { "Authorization": "Bearer " + token }
          });
          const prediction = await res.json();

          if (prediction.status === "succeeded") {
            clearInterval(interval);
            document.getElementById('loading-spinner').classList.add('hidden');
            const resultImg = document.getElementById('result-img');
            resultImg.src = prediction.output;
            resultImg.classList.remove('hidden');
            statusText.innerText = "Pasbeurt voltooid!";
          } else if (prediction.status === "failed") {
            clearInterval(interval);
            alert("Generatie mislukt. Probeer andere foto's.");
            document.getElementById('loading-spinner').classList.add('hidden');
            document.getElementById('result-img').classList.remove('hidden');
          } else {
            statusText.innerText = "AI berekent pasvorm... (" + prediction.status + ")";
          }
        } catch (e) {
          // Tijdelijke netwerkdippers negeren
        }
      }, 3000);
    }
  </script>
</body>
</html>
