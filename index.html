<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TryOn AI - Virtuele Pasbeurt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7f6f2; }
  </style>
</head>
<body class="bg-[#f7f6f2] text-stone-800 pb-12">

  <header class="bg-white border-b border-stone-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-lg">✨</div>
        <span class="text-xl font-bold tracking-tight">TryOn <span class="text-emerald-600">AI</span></span>
      </div>
      <div class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Systeem Gereed
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <div class="lg:col-span-5 bg-white p-5 rounded-2xl border border-stone-200 shadow-sm space-y-6">
        
        <div>
          <label class="block text-sm font-bold text-stone-900 mb-2">Stap 1: Foto van jezelf</label>
          <input type="file" id="user-upload" accept="image/*" class="w-full text-sm text-stone-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 border border-stone-200 rounded-xl p-2" onchange="previewFile(event, 'user')">
          <div class="mt-2 rounded-xl overflow-hidden hidden" id="user-preview-container">
            <img id="user-preview-img" class="w-full h-40 object-cover rounded-xl border border-stone-200">
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-stone-900 mb-2">Stap 2: Upload kledingstuk</label>
          <input type="file" id="cloth-upload" accept="image/*" class="w-full text-sm text-stone-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 border border-stone-200 rounded-xl p-2" onchange="previewFile(event, 'cloth')">
          <div class="mt-2 rounded-xl overflow-hidden hidden" id="cloth-preview-container">
            <img id="cloth-preview-img" class="w-full h-40 object-cover rounded-xl border border-stone-200">
          </div>
        </div>

        <button onclick="startTryOn()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-base">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Genereer Echte AI Pasbeurt
        </button>

      </div>

      <div class="lg:col-span-7 bg-white p-5 rounded-2xl border border-stone-200 shadow-sm flex flex-col justify-between space-y-4">
        <div>
          <h2 class="text-lg font-bold text-stone-900 mb-4">AI Pasresultaat</h2>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="relative rounded-xl overflow-hidden bg-stone-100 border border-stone-200 aspect-[3/4]">
              <img id="person-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600" class="w-full h-full object-cover" alt="Persoon">
              <span class="absolute bottom-3 left-3 bg-black/60 backdrop-blur text-white text-xs font-semibold px-2.5 py-1 rounded-md">Jouw Foto</span>
            </div>

            <div class="relative rounded-xl overflow-hidden bg-stone-100 border border-stone-200 aspect-[3/4] flex items-center justify-center">
              <div id="loading-spinner" class="hidden flex-col items-center gap-2 text-emerald-600 p-4 text-center">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-2"></i>
                <span class="text-xs font-bold" id="loading-text">AI verwerkt pasbeurt (10-15 sec)...</span>
              </div>
              <img id="result-img" src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600" class="w-full h-full object-cover" alt="AI Resultaat">
              <span class="absolute bottom-3 left-3 bg-emerald-600 text-white text-xs font-semibold px-2.5 py-1 rounded-md">✨ Echte AI Gegenereerd</span>
            </div>
          </div>
        </div>

        <div class="pt-4 border-t border-stone-100 flex justify-between items-center text-xs text-stone-500">
          <span>Status: <strong id="status-text" class="text-emerald-600">Selecteer foto's</strong></span>
          <span>Model: IDM-VTON</span>
        </div>
      </div>

    </div>
  </main>

  <script>
    const API_TOKEN = "r8_MQkk9iiLNryXui1KX6xDVdXrzJN3m912uWCpM";
    let userBase64 = null;
    let clothBase64 = null;

    function previewFile(event, type) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 512;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) { height *= maxDim / width; width = maxDim; }
          } else {
            if (height > maxDim) { width *= maxDim / height; height = maxDim; }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

          if (type === 'user') {
            userBase64 = dataUrl;
            document.getElementById('person-img').src = dataUrl;
            document.getElementById('user-preview-img').src = dataUrl;
            document.getElementById('user-preview-container').classList.remove('hidden');
          } else {
            clothBase64 = dataUrl;
            document.getElementById('cloth-preview-img').src = dataUrl;
            document.getElementById('cloth-preview-container').classList.remove('hidden');
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function startTryOn() {
      if (!userBase64 || !clothBase64) {
        alert("Selecteer bij Stap 1 en Stap 2 eerst een foto!");
        return;
      }

      const spinner = document.getElementById('loading-spinner');
      const resultImg = document.getElementById('result-img');
      const statusText = document.getElementById('status-text');

      resultImg.classList.add('hidden');
      spinner.classList.remove('hidden');
      spinner.classList.add('flex');
      statusText.innerText = "Verbinding maken met AI...";

      try {
        const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent("https://api.replicate.com/v1/predictions");
        
        const response = await fetch(proxyUrl, {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + API_TOKEN,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            version: "c87eec610ab5800070c58977739717d121542dded30f2bb00337c1a84f392289",
            input: {
              human_img: userBase64,
              garm_img: clothBase64,
              garment_des: "clothing"
            }
          })
        });

        const data = await response.json();

        if (data.error || data.detail) {
          alert("Melding: " + (data.error || data.detail));
          spinner.classList.add('hidden');
          resultImg.classList.remove('hidden');
          return;
        }

        pollResult(data.urls.get);

      } catch (err) {
        alert("Fout bij verwerken: " + err.message);
        spinner.classList.add('hidden');
        resultImg.classList.remove('hidden');
      }
    }

    async function pollResult(getUrl) {
      const statusText = document.getElementById('status-text');
      const proxyGet = "https://corsproxy.io/?" + encodeURIComponent(getUrl);

      const interval = setInterval(async () => {
        try {
          const res = await fetch(proxyGet, {
            headers: { "Authorization": "Bearer " + API_TOKEN }
          });
          const result = await res.json();

          if (result.status === "succeeded") {
            clearInterval(interval);
            document.getElementById('loading-spinner').classList.add('hidden');
            const resultImg = document.getElementById('result-img');
            resultImg.src = result.output;
            resultImg.classList.remove('hidden');
            statusText.innerText = "Pasbeurt voltooid!";
          } else if (result.status === "failed") {
            clearInterval(interval);
            alert("Mislukt, probeer scherpere foto's.");
            document.getElementById('loading-spinner').classList.add('hidden');
            document.getElementById('result-img').classList.remove('hidden');
          } else {
            statusText.innerText = "AI past kleding aan... (" + result.status + ")";
          }
        } catch (e) {}
      }, 3000);
    }
  </script>
</body>
</html>
