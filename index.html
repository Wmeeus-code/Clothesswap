<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TryOn AI - Virtuele Pasbeurt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7f6f2; }
  </style>
</head>
<body class="bg-[#f7f6f2] text-stone-800 pb-12">

  <header class="bg-white border-b border-stone-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-lg">✨</div>
        <span class="text-xl font-bold tracking-tight">TryOn <span class="text-emerald-600">AI</span></span>
      </div>
      <div class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        API Actief
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">
    
    <!-- Token Invoer Mobiel Vriendelijk -->
    <div id="token-banner" class="bg-stone-900 text-white p-4 rounded-2xl shadow-sm">
      <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-emerald-400">Replicate API Token</label>
      <div class="flex flex-col sm:flex-row gap-2">
        <input type="password" id="api-token-input" placeholder="Plak je token (r8_...)" class="w-full bg-white/10 border border-stone-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-400">
        <button onclick="saveToken()" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition shrink-0">
          Opslaan
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <div class="lg:col-span-5 bg-white p-5 rounded-2xl border border-stone-200 shadow-sm space-y-6">
        
        <div>
          <label class="block text-sm font-bold text-stone-900 mb-2">Stap 1: Foto van jezelf</label>
          <div class="border-2 border-dashed border-stone-300 rounded-xl p-4 text-center hover:border-emerald-500 transition bg-stone-50 cursor-pointer relative overflow-hidden min-h-[140px] flex flex-col justify-center items-center" onclick="document.getElementById('user-upload').click()">
            <img id="preview-user" class="hidden absolute inset-0 w-full h-full object-cover rounded-xl" />
            <div id="user-upload-box" class="z-10 flex flex-col items-center">
              <i class="fa-solid fa-camera text-stone-400 text-3xl mb-2"></i>
              <p class="text-xs font-semibold text-stone-700" id="user-upload-text">Upload een foto van jezelf</p>
            </div>
            <input type="file" id="user-upload" class="hidden" accept="image/*" onchange="processImage(event, 'user')">
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-stone-900 mb-2">Stap 2: Upload kledingstuk</label>
          <div class="border-2 border-dashed border-stone-300 rounded-xl p-4 text-center hover:border-emerald-500 transition bg-stone-50 cursor-pointer relative overflow-hidden min-h-[140px] flex flex-col justify-center items-center" onclick="document.getElementById('cloth-upload').click()">
            <img id="preview-cloth" class="hidden absolute inset-0 w-full h-full object-cover rounded-xl" />
            <div id="cloth-upload-box" class="z-10 flex flex-col items-center">
              <i class="fa-solid fa-shirt text-stone-400 text-3xl mb-2"></i>
              <p class="text-xs font-semibold text-stone-700" id="cloth-upload-text">Upload een kledingstuk</p>
            </div>
            <input type="file" id="cloth-upload" class="hidden" accept="image/*" onchange="processImage(event, 'cloth')">
          </div>
        </div>

        <button onclick="generateRealTryOn()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-base">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Genereer Echte AI Pasbeurt
        </button>

      </div>

      <div class="lg:col-span-7 bg-white p-5 rounded-2xl border border-stone-200 shadow-sm flex flex-col justify-between space-y-4">
        <div>
          <h2 class="text-lg font-bold text-stone-900 mb-4">AI Pasresultaat</h2>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="relative rounded-xl overflow-hidden bg-stone-100 border border-stone-200 aspect-[3/4]">
              <img id="person-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600" class="w-full h-full object-cover" alt="Persoon">
              <span class="absolute bottom-3 left-3 bg-black/60 backdrop-blur text-white text-xs font-semibold px-2.5 py-1 rounded-md">Jouw Foto</span>
            </div>

            <div
